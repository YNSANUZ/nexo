name: Inverter URLs dos baixadores

on:
  workflow_dispatch:

concurrency:
  group: hostinger-swap-baixadores
  cancel-in-progress: false

jobs:
  swap:
    name: Trocar aplicativos com reversao automatica
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets FTP
        shell: bash
        run: |
          test -n "$FTP_SERVER" || { echo "FTP_SERVER ausente"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "FTP_USERNAME ausente"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD ausente"; exit 1; }

      - name: Inverter pastas, corrigir caminhos e conferir publicacao
        shell: bash
        run: |
          python3 <<'PY'
          from ftplib import FTP
          from io import BytesIO
          from urllib.request import Request, urlopen
          import json
          import os
          import posixpath
          import re
          import time

          server = os.environ["FTP_SERVER"].replace("ftp://", "").replace("ftps://", "").strip().strip("/")
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          root = "/domains/primusdf.com.br/public_html"
          official_old = root + "/baixa-nexo"
          downloader_old = root + "/baixador"
          swap_temp = root + "/.__codex_swap_baixadores_20260806"
          rollback_temp = root + "/.__codex_rollback_baixadores_20260806"
          nexo_index = root + "/NEXO/index.html"
          text_suffixes = {
              ".html", ".htm", ".js", ".mjs", ".css", ".json", ".webmanifest",
              ".txt", ".xml", ".svg", ".map", ".htaccess", ".php"
          }

          def connect():
              last_error = None
              for attempt in range(1, 6):
                  candidate = FTP()
                  try:
                      print(f"Conectando no FTP, tentativa {attempt}/5...")
                      candidate.connect(server, 21, timeout=30)
                      candidate.login(username, password)
                      candidate.set_pasv(True)
                      if candidate.sock:
                          candidate.sock.settimeout(90)
                      return candidate
                  except Exception as exc:
                      last_error = exc
                      try:
                          candidate.close()
                      except Exception:
                          pass
                      print(f"Tentativa {attempt}/5 falhou: {type(exc).__name__}: {exc}")
                      time.sleep(8)
              raise last_error

          ftp = connect()

          def exists_dir(path):
              current = ftp.pwd()
              try:
                  ftp.cwd(path)
                  return True
              except Exception:
                  return False
              finally:
                  try:
                      ftp.cwd(current)
                  except Exception:
                      pass

          def walk_files(base):
              files = []
              for name, facts in ftp.mlsd(base):
                  if name in {".", ".."}:
                      continue
                  path = posixpath.join(base, name)
                  kind = facts.get("type", "")
                  if kind == "dir":
                      files.extend(walk_files(path))
                  elif kind == "file":
                      files.append(path)
              return files

          def read_file(path):
              chunks = []
              ftp.retrbinary("RETR " + path, chunks.append)
              return b"".join(chunks)

          def write_file(path, data):
              ftp.storbinary("STOR " + path, BytesIO(data))

          def rel(path, base):
              return path[len(base):].lstrip("/")

          def is_text(path):
              name = posixpath.basename(path).lower()
              return name == ".htaccess" or posixpath.splitext(name)[1] in text_suffixes

          if not exists_dir(official_old) or not exists_dir(downloader_old):
              raise RuntimeError("Uma das duas pastas de origem nao existe.")
          if exists_dir(swap_temp) or exists_dir(rollback_temp):
              raise RuntimeError("Pasta temporaria de uma tentativa anterior encontrada; interrompendo com seguranca.")

          official_index = read_file(official_old + "/index.html")
          downloader_index = read_file(downloader_old + "/index.html")
          if b"Baixador NEXO" not in official_index:
              raise RuntimeError("O site branco oficial nao foi identificado em /baixa-nexo.")
          if b"BaixaNEXO" not in downloader_index:
              raise RuntimeError("O baixador nao foi identificado em /baixador.")

          official_original = {}
          official_changed = {}
          placeholder = b"/__CODEX_DOWNLOADER_PATH__"
          for path in walk_files(official_old):
              if not is_text(path):
                  continue
              data = read_file(path)
              changed = data.replace(b"/baixador", placeholder)
              changed = changed.replace(b"/baixa-nexo", b"/baixador")
              changed = changed.replace(placeholder, b"/baixa-nexo")
              if changed != data:
                  key = rel(path, official_old)
                  official_original[key] = data
                  official_changed[key] = changed

          downloader_original = {}
          downloader_changed = {}
          for path in walk_files(downloader_old):
              if not is_text(path):
                  continue
              data = read_file(path)
              changed = data.replace(b"/baixador", b"/baixa-nexo")
              if changed != data:
                  key = rel(path, downloader_old)
                  downloader_original[key] = data
                  downloader_changed[key] = changed

          nexo_original = read_file(nexo_index)
          nexo_changed = nexo_original.replace(b'../baixador/', b'../baixa-nexo/')
          if nexo_changed == nexo_original:
              print("O link do NEXO ja estava atualizado ou nao foi encontrado.")

          state = 0

          def restore_original():
              global ftp, state
              print("Falha detectada; restaurando os dois caminhos originais...")
              try:
                  ftp.voidcmd("NOOP")
              except Exception:
                  try:
                      ftp.close()
                  except Exception:
                      pass
                  ftp = connect()

              if state == 3:
                  ftp.rename(downloader_old, rollback_temp)
                  ftp.rename(official_old, downloader_old)
                  ftp.rename(rollback_temp, official_old)
              elif state == 2:
                  ftp.rename(official_old, downloader_old)
                  ftp.rename(swap_temp, official_old)
              elif state == 1:
                  ftp.rename(swap_temp, official_old)

              for key, data in official_original.items():
                  write_file(posixpath.join(official_old, key), data)
              for key, data in downloader_original.items():
                  write_file(posixpath.join(downloader_old, key), data)
              write_file(nexo_index, nexo_original)
              state = 0
              print("Restauracao concluida.")

          def get(url):
              separator = "&" if "?" in url else "?"
              req = Request(url + separator + "codex=" + str(int(time.time())), headers={
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "User-Agent": "NEXO deployment verifier",
              })
              with urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} em {url}")
                  return response.read()

          try:
              ftp.rename(official_old, swap_temp)
              state = 1
              ftp.rename(downloader_old, official_old)
              state = 2
              ftp.rename(swap_temp, downloader_old)
              state = 3

              for key, data in official_changed.items():
                  write_file(posixpath.join(downloader_old, key), data)
              for key, data in downloader_changed.items():
                  write_file(posixpath.join(official_old, key), data)
              if nexo_changed != nexo_original:
                  write_file(nexo_index, nexo_changed)

              official_live = get("https://primusdf.com.br/baixador/").decode("utf-8", "replace")
              downloader_live = get("https://primusdf.com.br/baixa-nexo/").decode("utf-8", "replace")
              official_config = get("https://primusdf.com.br/baixador/config.js").decode("utf-8", "replace")
              official_manifest = get("https://primusdf.com.br/baixador/manifest.webmanifest").decode("utf-8", "replace")
              downloader_manifest = get("https://primusdf.com.br/baixa-nexo/manifest.webmanifest").decode("utf-8", "replace")
              health = json.loads(get("https://primusdf.com.br/baixa-nexo/api/health").decode("utf-8"))
              nexo_live = get("https://primusdf.com.br/NEXO/").decode("utf-8", "replace")

              checks = [
                  ("site branco em /baixador", "Baixador NEXO" in official_live),
                  ("assets oficiais em /baixador", "/baixador/_next/" in official_live and "/baixa-nexo/_next/" not in official_live),
                  ("manifest oficial em /baixador", "/baixador/" in official_manifest),
                  ("fallback oficial aponta ao baixador", "https://primusdf.com.br/baixa-nexo/api" in official_config),
                  ("baixador em /baixa-nexo", "BaixaNEXO" in downloader_live and "data-download-form" in downloader_live),
                  ("manifest do baixador em /baixa-nexo", "/baixa-nexo/" in downloader_manifest),
                  ("backend do baixador funcional", health.get("ok") is True),
                  ("link do hub NEXO atualizado", '../baixa-nexo/' in nexo_live),
              ]
              failed = [name for name, ok in checks if not ok]
              if failed:
                  raise RuntimeError("Falharam: " + ", ".join(failed))

              asset_paths = sorted(set(re.findall(r'(?:src|href)=["\'](/baixador/[^"\']+)["\']', official_live)))
              if not asset_paths:
                  raise RuntimeError("Nenhum asset do site oficial foi localizado.")
              for asset in asset_paths:
                  get("https://primusdf.com.br" + asset)

              print(f"Troca concluida: {len(official_changed)} arquivos oficiais e {len(downloader_changed)} arquivos do baixador atualizados.")
              print(f"Assets oficiais conferidos: {len(asset_paths)}.")
          except Exception:
              restore_original()
              raise
          finally:
              try:
                  ftp.quit()
              except Exception:
                  try:
                      ftp.close()
                  except Exception:
                      pass
          PY
